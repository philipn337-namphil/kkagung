services:
  mysql:
    image: mysql:8.4
    container_name: kkagung-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-kkagung}
      MYSQL_USER: ${DB_USER:-kkagung_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../backend
    container_name: kkagung-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_value}
      DATABASE_URL: mysql://${DB_USER:-kkagung_app}:${DB_PASSWORD:-change_me}@mysql:3306/${DB_NAME:-kkagung}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
